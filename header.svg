@keyframes pulse {
0%, 100% {
transform: scale(0.95);
opacity: 0.7;
}
50% {
transform: scale(1.05);
opacity: 1;
}
}
.container {
display: flex;
justify-content: center;
align-items: center;
height: 100px;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
h1 {
color: #2563EB;
font-size: 42px;
font-weight: 700;
margin: 0;
animation: pulse 2.5s infinite ease-in-out;
}
